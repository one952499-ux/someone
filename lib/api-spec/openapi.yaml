openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: messages
    description: Visitor message operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /messages:
    post:
      operationId: createMessage
      tags: [messages]
      summary: Submit a visitor message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /messages/count:
    get:
      operationId: getMessageCount
      tags: [messages]
      summary: Get total message count
      responses:
        "200":
          description: Count of messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageCount"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Message:
      type: object
      properties:
        id:
          type: integer
        content:
          type: string
        name:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - content
        - createdAt

    MessageInput:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000
        name:
          type: ["string", "null"]
      required:
        - content

    MessageCount:
      type: object
      properties:
        count:
          type: integer
      required:
        - count

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
